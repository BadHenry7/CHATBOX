entities:
  - cedula

slots:
  cedula:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: cedula

responses:
  utter_saludo:
  - text: "Hola soy Tonyo, tu asistente medico personal, como estas?"
   

  utter_despedida:
  - text: "Adios"

  utter_afirmativo:
    - text: "¡Genial!"
  
  utter_negativo:
    - text: "Entiendo, no hay problema."

  utter_agradecimiento:
    - text: "¡De nada! Siempre estoy aquí para ayudar."

  utter_feliz:
    - text: "¡Me alegra saberlo! 😊"
  
  utter_triste:
  - text: "Aquí hay algo para animarte:"
    image: "https://preview.redd.it/dgpjg45r7vo61.jpg?width=640&crop=smart&auto=webp&s=c42e8f00f4b8473691dcacac583c84d432a03636"

  utter_iamabot:
  - text: "Yo soy un bot, me llamo Tonyo, tu asistente medico virtual."

  utter_agendar_cita:
    - text: "Para agendar una cita, ve a la opcion de 'Agendar cita medica'"

  utter_consultar_cita:
    - text: "Para consultar tu cita ve a la opcion de 'Consultar cita'"
  
  utter_consultar_sintomas:
    - text: "Si te sientes enfermo, por favor, agendar tu cita en la opcion de Agendar cita"


  utter_informacion_hospital:
    - text: "En el pie de pagina encontraras informacion del hospital asi como tambien en la vista ubicaciones del navbar encotraras los hospitales mas cercanos"

  utter_descargar_certificado:
    - text: "Para descargar la incapacidad, ve a la vista 'Incapacidad medica'"

  utter_generar_reporte:
    - text: "Para realizar reportes, ve a la opcion 'Reportes' en el menu superior" 
  
  utter_iglaturroña:
    - text: "Lo siento, no entendí eso."

  utter_repeticion_caracteres:
    - text: "Parece que estás divirtiéndote con el teclado. 😄"
  

  utter_out_of_scope:
    - text: "Lo siento, pero no tengo información sobre eso."

  utter_did_that_help:
    - text: "Eso te ayuda?"  

 
  utter_ultima_cita:
   - text: "Tu última cita fue el {fecha} con el doctor {doctor}."

  utter_dar_cedula:
    - text: "Hola, me podrias indicar el numero de tu documento de identidad 😄"

  utter_Hola_B:
    - text: "Voy a inflarme completamente antes de operar correctamente …bzzzt……bzzzt……bzzzt…"
  
  utter_Hola_B2:
    - text: "Hola, soy Baymax, tu asistente medico personal"
  
  utter_Hola_B3:
    - text: "jeje, hola, ¿como estas? 😄"
  
  utter_Primeros_auxilios:
    - text: "Ante una emergencia aplica primeros auxilios básicos: verifica la conciencia, llama a emergencias y realiza las maniobras necesarias de acuerdo a la situación."
  
  utter_Horario_de_atencion:
    - text: "Nuestro horario de atención de servicio al cliente es de lunes a viernes de 7:00 a.m. a 5:00 p.m. y sábados y domingos de 8:00 a.m. a 12:00 p.m, y en el hospital es 24/7"
    
  utter_Pedir_incapacidad:
    - text: "Para solicitar una incapacidad debe entrar a la opcion 'Incapacidad', y recuerde que para generar una incapacidad el medico la debe generar en la consulta"
    
  utter_Contacto:
    - text: "Puedes comunicarte con nosotros al correo hostipalinc.github@gmail.com"

  utter_Ejercicios:
    - text: "Se recomienda hacer al menos 150 minutos de ejercicio moderado o 75 minutos de ejercicio intenso a la semana"

  utter_Emergencias:
    - text: "En caso de emergencias graves como desmayos, infartos o caídas severas, llama inmediatamente al 123 o acude a la urgencia más cercana."

  utter_Atencion_de_urgencias:
    - text: "El servicio de urgencias está disponible las 24 horas, los 7 días de la semana."
  
  utter_ubicacion_clinica:
    - text: "Estamos ubicados en la calle 45 con cra 20, frente a la estación de transmetro de la 21."

  utter_Corregir_informacion:
    - text: "Para actualizar tu información personal, acércate a recepción o debes enviar un correo al hostipalinc.github@gmail.com"
  
  utter_Video_recomendacion:
    - text: "Siga el siguiente video de recomendacion"
      image: "https://youtu.be/zGLVMjbXiHY?si=zZQoLBlztIhWSDIX"

  utter_farmacia_disponible:
    - text: "Contamos con farmacia en frente de la clínica, abierta de lunes a sábado en horario de atención habitual, de lunes a viernes 7 am a 8 pm y sábados de 8 am a 12 pm"

    
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

  