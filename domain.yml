  utter_afirmativo:
    - text: "¡Genial!"
  
  utter_negativo:
    - text: "Entiendo, no hay problema."

  utter_agradecimiento:
    - text: "¡De nada! Siempre estoy aquí para ayudar."

  utter_feliz:
    - text: "¡Me alegra saberlo! 😊"
  
  utter_triste:
  - text: "Aquí hay algo para animarte:"
