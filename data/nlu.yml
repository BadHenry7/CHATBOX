#-----------------------------------------------Intenciones de chatbox con MYSQL

- intent: consultar_cita
  examples: |
    - ¿Cuándo tengo mi próxima cita?
    - Quisiera saber la fecha de mi consulta
    - ¿A qué hora es mi cita médica?
    - ¿Puedes decirme cuándo tengo cita con el doctor?
    - ¿Dónde puedo ver mis citas programadas?    

- intent: diagnostico_medico
  examples: |
    - ¿Cual fue mi diagnostico de mi ultima cita?
    - Quisiera saber mi diagnostico
    - Podria ver el diagnostico del medico
    - ¿Puedes decirme que me diagnostico el medico
    - Dónde puedo saber mi diagnostico dado por el medico?    

- intent: recomendaciones_medica
  examples: |
    - ¿Que me recomienda el medico?
    - ¿Cuál es el consejo del doctor?
    - ¿Tienes alguna recomendación médica para mí?
    - ¿Qué cuidados debo seguir según el médico?
    - ¿Qué tratamiento me sugiere el doctor?
    

- intent: sintomas_medica
  examples: |
    - ¿Cual fue el sintoma de mi consulta?
    - ¿Qué síntomas tuve en mi última cita?
    - ¿Cuáles fueron los síntomas registrados en mi consulta?
    - ¿Qué síntomas mencioné en mi cita médica?
    - ¿Qué síntomas tengo según mi historial?

- intent: ubicacion_salas_cita
  examples: |
    - ¿En que hospital y sala es mi proxima cita?
    - ¿Dónde será mi próxima consulta médica?
    - ¿En qué sala tengo mi cita programada?
    - ¿Cuál es la ubicación de mi próxima cita médica?
    - ¿En qué hospital debo presentarme para mi cita?