version: "3.1"

rules:

- rule: Responder a un saludo
  steps:
  - intent: hola
  - action: utter_saludo


- rule: Decir adios cuando el usuario diga adios
  steps:
  - intent: Adios
  - action: utter_despedida


- rule: Responder afirmativamente
  steps:
  - intent: Si
  - action: utter_afirmativo


- rule: Responder negativamente
  steps:
  - intent: No
  - action: utter_negativo

- rule: Responder a un agradecimiento
  steps:
  - intent: agradecimiento
  - action: utter_agradecimiento

- rule: Responder a un estado de ánimo positivo
  steps:
  - intent: mood_great
  - action: utter_feliz

- rule: Responder a un estado de ánimo negativo
  steps:
  - intent: mood_unhappy
  - action: utter_triste
  - action: utter_did_that_help


- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot


- rule: Agendar una cita médica
  steps:
  - intent: agendar_cita
  - action: utter_agendar_cita

# - rule: Consultar cita médica
#   steps:
#   - intent: consultar_cita
#   - action: utter_consultar_cita


- rule: Consultar síntomas
  steps:
  - intent: sintomas
  - action: utter_consultar_sintomas

- rule: Información sobre el hospital
  steps:
  - intent: informacion_hospital
  - action: utter_informacion_hospital



- rule: Descargar certificado médico
  steps:
  - intent: descargar_certificado
  - action: utter_descargar_certificado

- rule: Generar reporte médico
  steps:
  - intent: generar_reporte
  - action: utter_generar_reporte


- rule: decir 'Que pedo dijistes ahi cuando no entienda algo
  steps:
  - intent: iglaturroña
  - action: utter_iglaturroña


- rule: Manejar repetición de caracteres
  steps:
  - intent: repeticion_caracteres
  - action: utter_repeticion_caracteres


- rule: Manejar consultas fuera de contexto
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

#--
- rule: responder primeros auxilios
  steps:
  - intent: Primeros_auxilios
  - action: utter_Primeros_auxilios

- rule: responder horario de atención
  steps:
  - intent: Horario_de_atencion
  - action: utter_Horario_de_atencion

- rule: responder pedir incapacidad
  steps:
  - intent: Pedir_incapacidad
  - action: utter_Pedir_incapacidad

- rule: responder contacto
  steps:
  - intent: Contacto
  - action: utter_Contacto

- rule: responder ejercicios
  steps:
  - intent: Ejercicios
  - action: utter_Ejercicios

- rule: responder emergencias
  steps:
  - intent: Emergencias
  - action: utter_Emergencias

- rule: responder atención de urgencias
  steps:
  - intent: Atencion_de_urgencias
  - action: utter_Atencion_de_urgencias

- rule: responder ubicación clínica
  steps:
  - intent: ubicacion_clinica
  - action: utter_ubicacion_clinica

- rule: responder corregir información
  steps:
  - intent: Corregir_informacion
  - action: utter_Corregir_informacion

- rule: responder video recomendación
  steps:
  - intent: Video_recomendacion
  - action: utter_Video_recomendacion

- rule: responder farmacia disponible
